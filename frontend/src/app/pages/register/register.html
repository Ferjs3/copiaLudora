<form >

    <fieldset>
        <label for="name">Nombre</label>
        <input type="text" name="name" id="name"  >
    </fieldset>

    <fieldset>
        <label for="lastName">Apellido</label>
        <input type="text" name="lastName" id="lastName" >
    </fieldset>

    <fieldset>
        <label for="userName">Nombre de Usuario</label>
        <input type="text" name="userName" id="userName" >
    </fieldset>

    <fieldset>
        <label for="Email">Email</label>
        <input type="text" name="Email" id="Email">
    </fieldset>

    <fieldset>
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="Introduce aqui tu contraseña">
    </fieldset>

    <fieldset>
        <label for="password2">Confirmar Contraseña</label>
        <input type="password" name="password2" id="password2" placeholder="Introducir devuelta su contraseña">
    </fieldset>

    <fieldset>
        <label for="phone">Telefono</label>
        <input type="tel" name="phone" id="phone" placeholder="+34 612 34 56 78">
    </fieldset>

    <p>Direccion:</p>
    <fieldset>
        <label for="street">Calle</label>
        <input type="text" name="street" id="street">
    </fieldset>
    <fieldset>
        <label for="numberStreet">Numero</label>
        <input type="number" name="numberStreet" id="numberStreet" placeholder="Numero de calle">
    </fieldset>

    <fieldset>
        <label for="birthdate">Fecha de nacimiento</label>
        <input type="date" name="birthdate" id="birthdate">
    </fieldset>

    <button>Registrarse</button>
</form>
