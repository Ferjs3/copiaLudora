<div class="container">
  <div class="columna">
      @if (isLoading()) {
    <div class="loading">Cargando tienda...</div>
  } @else {
    <!-- buscador -->
    <app-search></app-search>
    
    <!-- carrusel -->
    <app-carousel [items]="featuredGames()"></app-carousel>

    <!-- chips de categorías -->
    <app-category-slide [genres]="genres()"></app-category-slide>  

    <!-- chips de companias -->
    <app-company-slide [companies]="companies()"></app-company-slide>

}
  </div>
</div>
